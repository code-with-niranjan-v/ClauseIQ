# Starts the ingestion worker with its PostgreSQL (pgvector) and Neo4j.
# Kafka and MinIO come from circular-scanner's Compose project, joined through its network.
services:
  circular-ingestion:
    build: .
    ports:
      - "127.0.0.1:${INGESTION_PORT:-8000}:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      DATABASE_URL: postgresql://clauseiq:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@ingestion-postgres:5432/clauseiq
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      EMBEDDING_PROVIDER: openai
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
    depends_on:
      ingestion-postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - default
      - scanner
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  ingestion-postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: clauseiq
      POSTGRES_USER: clauseiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ingestion-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clauseiq -d clauseiq"]
      interval: 3s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

networks:
  scanner:
    name: ${SCANNER_NETWORK:-circular-scanner_default}
    external: true

volumes:
  ingestion-postgres-data:
  neo4j-data:
