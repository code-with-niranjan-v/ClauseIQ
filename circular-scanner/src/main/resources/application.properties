spring.application.name=circular-scanner
spring.sql.init.mode=always
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[max.block.ms]=10000
spring.kafka.producer.properties[request.timeout.ms]=10000
spring.kafka.producer.properties[delivery.timeout.ms]=30000
management.endpoint.health.probes.enabled=true
scanner.cron=0 0 6 * * *
scanner.zone=Asia/Kolkata
scanner.outbox-delay=30000
scanner.kafka-topic=regulatory.document.ingested
scanner.minio.endpoint=http://localhost:9000
scanner.minio.bucket=regulatory-originals
scanner.minio.access-key=${MINIO_ROOT_USER:}
scanner.minio.secret-key=${MINIO_ROOT_PASSWORD:}
spring.task.scheduling.pool.size=2
