server {
    listen 80;
    root /usr/share/nginx/html;

    # The page calls /api on its own origin. Forward those calls to the backend.
    location /api/ {
        client_max_body_size 31m;
        proxy_pass http://clauseiq-backend:8080;
        proxy_set_header Host $http_host;
        # A manual scan returns only when the scan has finished.
        proxy_read_timeout 600s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
