spring.application.name=clauseiq-backend
# The ingestion worker's PostgreSQL. The worker creates the obligation and finding tables.
spring.datasource.url=jdbc:postgresql://localhost:5432/clauseiq
spring.datasource.username=clauseiq
spring.datasource.password=
spring.sql.init.mode=always
server.error.include-message=always
management.endpoint.health.probes.enabled=true
# circular-scanner, for the source administration endpoints.
clauseiq.scanner-url=http://localhost:8081
clauseiq.cors-allowed-origins=http://localhost:5173,http://localhost:3000
