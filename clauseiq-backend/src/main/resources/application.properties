spring.application.name=clauseiq-backend
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=31MB
# The ingestion worker's PostgreSQL. The worker creates the obligation and finding tables.
spring.datasource.url=jdbc:postgresql://localhost:5432/clauseiq
spring.datasource.username=clauseiq
spring.datasource.password=
spring.sql.init.mode=always
server.error.include-message=always
management.endpoint.health.probes.enabled=true
# circular-scanner, for the source administration endpoints.
clauseiq.scanner-url=http://localhost:8081
clauseiq.ingestion-url=http://localhost:8000
clauseiq.cors-allowed-origins=http://localhost:5173,http://localhost:3000
# Sessions for the signed-in UI. The cookie is HttpOnly; CSRF uses the XSRF-TOKEN cookie and header.
server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=lax
# First administrator, created only when no accounts exist. A blank password generates one and logs it once.
clauseiq.admin.username=${CLAUSEIQ_ADMIN_USERNAME:admin}
clauseiq.admin.password=${CLAUSEIQ_ADMIN_PASSWORD:}
